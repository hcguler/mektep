<!-- Tema (çocuk / yetişkin) uygulama ana ekranıyla, renk (koyu / açık) siteyle ortaktır; ilk boyamadan önce uygulanır -->
<script>
(function(){var d=document.documentElement,t,m;try{t=localStorage.getItem('apps:tema');m=localStorage.getItem('theme')}catch(e){}
if(t!=='cocuk'&&t!=='yetiskin'){try{t=JSON.parse(localStorage.getItem('ezberler:v1')||'{}').theme}catch(e){}} // önceki sürümün kendi tema kaydı
if(t!=='cocuk'&&t!=='yetiskin')t='yetiskin';
if(m!=='dark'&&m!=='light')m=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
d.setAttribute('data-theme',t);d.setAttribute('data-mode',m)})();
</script>
