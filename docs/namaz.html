*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;background:var(--gold);opacity:var(--pattern-o);-webkit-mask:var(--pattern) 0 0/80px 80px;mask:var(--pattern) 0 0/80px 80px;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(70vmax 60vmax at 0% 0%,var(--glow-1),transparent 62%),radial-gradient(60vmax 55vmax at 100% 100%,var(--glow-2),transparent 62%);pointer-events:none}
button{font:inherit;color:inherit}
a{color:inherit}
h2,h3,p,ul,ol,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
::selection{background:var(--gold);color:var(--primary-ink)}
.ic{width:1.15em;height:1.15em;flex:none}

/* ---------- İskelet ---------- */
.app{position:relative;z-index:1;height:100vh;height:100dvh;max-width:860px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "main" "nav";overflow:hidden}
header.top{grid-area:head;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top))}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0}
.brand{min-width:0;font-family:var(--font-d);font-weight:calc(var(--hw) + 100);font-size:1.36rem;line-height:1.1;letter-spacing:.005em;white-space:nowrap}
.brand em{font-style:italic;font-weight:600;color:var(--gold)}
.brand small{display:none;margin-top:6px;font-family:var(--font-b);font-size:.74rem;font-weight:500;letter-spacing:.02em;color:var(--soft);white-space:normal}
.hsub{flex:1;min-width:0;font-size:.8rem;font-weight:500;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;margin-left:auto}
.ibtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:40px;height:40px;padding:0 11px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:.84rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .3s var(--spring),border-color .25s,background .25s,color .25s}
.ibtn:hover{border-color:var(--gold);color:var(--gold)}
.ibtn:active{transform:scale(.93)}
.ibtn .ic{width:18px;height:18px}
.ibtn .lbl{display:none}

main{grid-area:main;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex;animation:viewIn .45s var(--ease) both}
main[data-dir="f"] .view.on{--dx:24px}
main[data-dir="b"] .view.on{--dx:-24px}
@keyframes viewIn{from{opacity:0;transform:translate3d(var(--dx,0),0,0)}}

/* ---------- Alt gezinme ---------- */
nav.tabbar{grid-area:nav;position:relative;z-index:2;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));--col:calc((100% - 12px) / 6);--pw:min(58px,calc(var(--col) - 4px))}
nav.tabbar::before{content:"";position:absolute;top:7px;height:30px;width:var(--pw);left:calc(6px + var(--tab,0) * var(--col) + (var(--col) - var(--pw)) / 2);border-radius:999px;background:var(--gold-soft);border:1px solid var(--line-2);transition:left .5s var(--spring)}
nav.tabbar button{position:relative;min-width:0;border:0;background:none;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:clamp(.6rem,2.8vw,.68rem);font-weight:600;letter-spacing:.01em;color:var(--faint);cursor:pointer;white-space:nowrap;transition:color .25s}
nav.tabbar button .ic{width:20px;height:20px;transition:transform .4s var(--spring)}
nav.tabbar button small{display:none}
nav.tabbar button:active .ic{transform:scale(.86)}
nav.tabbar button.on{color:var(--gold)}
nav.tabbar button.on .ic{transform:translateY(-1px) scale(1.08)}

/* ---------- Kart destesi ---------- */
.deckhost{flex:1;min-height:0;display:flex;flex-direction:column}
.deck{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.deck.swap{animation:deckIn .45s var(--ease) both}
@keyframes deckIn{from{opacity:0;transform:translate3d(0,14px,0)}}
.track{--g:22px;flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:100%;column-gap:14px;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:6px max(var(--g),calc((100% - 740px) / 2)) 20px;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:center;scroll-snap-stop:always;min-height:0;min-width:0;display:flex;transform:scale(.955);opacity:.45;transition:transform .5s var(--ease),opacity .5s var(--ease)}
.slide.cur{transform:none;opacity:1}
.sc{position:relative;flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 22px 24px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--bg)));box-shadow:var(--shadow);overflow-y:auto;overflow-x:hidden;overflow-wrap:break-word;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.sc>*{flex:none;width:100%;max-width:560px}
.sc>:first-child{margin-top:auto}
.sc>:last-child{margin-bottom:auto}
.sc.hero,.sc.memo{border-color:var(--line-2);background:radial-gradient(120% 80% at 50% 0%,var(--gold-soft),transparent 60%),linear-gradient(180deg,var(--surface-2),var(--surface))}
.sc.hero::before,.sc.memo::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--gold);opacity:calc(var(--pattern-o) * 1.5);-webkit-mask:var(--pattern) center/64px 64px,linear-gradient(180deg,#000,transparent 75%);-webkit-mask-composite:source-in;mask:var(--pattern) center/64px 64px,linear-gradient(180deg,#000,transparent 75%);mask-composite:intersect;pointer-events:none}
.sc.hero>*,.sc.memo>*{position:relative}
.more{position:sticky;bottom:-24px;max-width:none !important;margin:10px -22px -24px !important;padding:22px 0 10px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:linear-gradient(transparent,var(--surface) 55%);pointer-events:none;transition:opacity .25s}
.sc>.more{position:sticky}
.more.gone{opacity:0}
.ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 16px 12px;width:100%;max-width:772px;margin:0 auto}
.nb{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .3s var(--spring),background .25s,color .25s,border-color .25s,opacity .25s}
.nb .ic{width:20px;height:20px}
.nb:not(:disabled):hover{border-color:var(--gold);color:var(--gold)}
.nb:not(:disabled):active{transform:scale(.9)}
.nb.next{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.nb.next:not(:disabled):hover{background:var(--primary-2);border-color:var(--primary-2);color:var(--primary-ink)}
.nb:disabled{opacity:.3;cursor:default}
.nb.wide{width:auto;border-radius:999px;padding:0 20px;gap:8px;display:inline-flex;align-items:center;font-size:.88rem;font-weight:600}
.pos{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line-2);transition:width .4s var(--spring),background .25s;cursor:pointer}
.dots i.on{width:24px;background:var(--gold)}
.bar{width:100%;max-width:240px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .45s var(--ease)}
.cnt{max-width:100%;font-size:.72rem;font-weight:500;letter-spacing:.03em;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* ---------- Kart içeriği ---------- */
.kick{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.kick::before,.kick::after{content:"";flex:0 1 34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.kick::after{transform:scaleX(-1)}
.sc h2{font-family:var(--font-d);font-weight:var(--hw);font-size:clamp(1.8rem,5.4vw,2.5rem);line-height:1.1;letter-spacing:-.005em;margin-bottom:12px}
.sc h3{font-family:var(--font-d);font-weight:var(--hw);font-size:clamp(1.5rem,4.4vw,1.9rem);line-height:1.15;margin-bottom:12px}
.sc.hero h2{font-size:clamp(2.2rem,8.4vw,3.3rem);line-height:1.04}
.sc h2 em,.sc h3 em{font-style:italic;color:var(--gold)}
.lead{font-size:1.02rem;color:var(--soft)}
.soft{color:var(--soft)}
.note{margin-top:16px;font-size:.84rem;line-height:1.55;color:var(--soft)}
.note b{color:var(--ink);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:8px;width:auto !important;align-self:center;margin-bottom:16px;padding:5px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag.ayet{--c:var(--ayet)} .tag.hadis{--c:var(--hadis)} .tag.yorum{--c:var(--yorum)}
.quote{font-family:var(--font-d);font-weight:500;font-size:clamp(1.3rem,3.9vw,1.68rem);line-height:1.42;color:var(--ink)}
.quote b{font-weight:700;color:var(--gold)}
.quote+.quote{margin-top:14px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px auto 12px;color:var(--gold)}
.orn::before,.orn::after{content:"";width:46px;height:1px;background:var(--line-2)}
.orn i{width:7px;height:7px;transform:rotate(45deg);border:1px solid currentColor}
.src{display:block;font-style:normal;font-size:.8rem;font-weight:500;letter-spacing:.04em;color:var(--soft)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:600;font-size:.92rem;cursor:pointer;transition:transform .3s var(--spring),background .25s,border-color .25s,color .25s,box-shadow .3s}
.btn:hover{background:var(--primary-2);border-color:var(--primary-2);box-shadow:0 14px 30px -16px var(--primary)}
.btn:active{transform:scale(.96)}
.btn.alt{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn.alt:hover{border-color:var(--gold);color:var(--gold);background:transparent;box-shadow:none}
.btn .ic{width:17px;height:17px}

.list{display:grid;text-align:left}
.list li{position:relative;padding:11px 0 11px 36px;border-bottom:1px solid var(--line);font-size:.98rem}
.list li:last-child{border-bottom:0}
.list li::before{content:"";position:absolute;left:2px;top:14px;width:20px;height:20px;border-radius:50%;background:var(--emerald-soft);border:1px solid color-mix(in srgb,var(--emerald) 50%,transparent)}
.list li::after{content:"";position:absolute;left:9px;top:19px;width:5px;height:9px;border:solid var(--emerald);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.list.warn li::before{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.list.warn li::after{content:"!";left:2px;top:14px;width:20px;height:20px;display:grid;place-items:center;border:0;transform:none;font-size:.74rem;font-weight:700;line-height:1;color:var(--danger)}
.list b{font-weight:600}
.numlist{counter-reset:n;display:grid;gap:8px;text-align:left}
.numlist li{counter-increment:n;display:flex;align-items:center;gap:16px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-weight:500}
.numlist li::before{content:counter(n);flex:none;width:30px;font-family:var(--font-d);font-size:1.6rem;font-weight:600;line-height:1;color:var(--gold);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);color:inherit;text-align:center}
button.tile{cursor:pointer;transition:transform .35s var(--spring),border-color .25s,background .25s}
button.tile:hover{border-color:var(--gold);transform:translateY(-3px)}
button.tile:active{transform:scale(.97)}
.tile .ti{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);color:var(--gold);margin-bottom:2px}
.tile .ti .ic{width:19px;height:19px}
.tile b{font-size:.95rem;font-weight:600;line-height:1.25}
.tile small{font-size:.78rem;line-height:1.4;color:var(--soft)}
.flow{position:relative;display:grid;gap:8px;text-align:left;padding-left:34px}
.flow::before{content:"";position:absolute;left:12px;top:16px;bottom:16px;width:1px;background:var(--line-2)}
.flow li{position:relative;padding:9px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:500}
.flow li::before{content:"";position:absolute;left:-27px;top:50%;width:9px;height:9px;margin-top:-5px;transform:rotate(45deg);background:var(--bg);border:1px solid var(--gold)}
.flow li b{color:var(--gold);font-weight:600}

/* figür: mihrap kemeri içinde */
.pose{position:relative;display:grid;place-items:center;width:min(100%,280px) !important;margin:0 auto 18px;padding:26px 16px 12px;border-radius:999px 999px 20px 20px;border:1px solid var(--line-2);background:radial-gradient(90% 60% at 50% 0%,var(--gold-soft),transparent 70%),var(--surface-2)}
.pose svg{display:block;height:min(26vh,190px);width:auto;max-width:100%;color:var(--ink)}
.slide.cur .pose svg{animation:poseIn .7s var(--ease) both}
@keyframes poseIn{from{transform:translateY(10px);opacity:0}}
.pose.sm{width:104px !important;margin-bottom:14px;padding:16px 8px 6px}
.pose.sm svg{height:74px}

/* okunuş kartı */
.ar{font-family:var(--font-ar);direction:rtl;font-size:clamp(1.55rem,5.2vw,2.05rem);line-height:2;color:var(--ink);margin:4px 0 8px}
.okunus{font-family:var(--font-d);font-style:italic;font-weight:500;font-size:1.22rem;line-height:1.45;color:var(--emerald)}
.mean{margin-top:16px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:.96rem}
.mean .lb,.ans .lb{display:block;margin-bottom:4px;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mean b{font-weight:600;color:var(--gold)}
.ans{margin-top:12px;padding:14px 16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--emerald) 40%,transparent);background:var(--emerald-soft);font-size:.96rem}
.ans .lb{color:var(--emerald)}

/* ---------- Durak seçici ve bölüm şeridi ---------- */
.stepper{flex:none;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;scroll-padding-inline:16px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.stepper::-webkit-scrollbar{display:none}
.stepper::before,.stepper::after{content:"";flex:1 0 0}
.stepper button{flex:none;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:.82rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .3s,border-color .3s,color .3s,transform .2s}
.stepper button:active{transform:scale(.95)}
.stepper button small{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);font-size:.72rem;font-weight:600;color:var(--soft);transition:background .3s,color .3s,border-color .3s}
.stepper button.done:not(.on) small{border-color:color-mix(in srgb,var(--emerald) 60%,transparent);color:var(--emerald)}
.stepper button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.stepper button.on small{background:color-mix(in srgb,var(--primary-ink) 14%,transparent);border-color:transparent;color:var(--primary-ink)}
.seg{flex:none;position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));width:calc(100% - 32px);max-width:560px;margin:0 auto 4px;padding:4px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);--col:calc((100% - 8px) / var(--n,5))}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:calc(4px + var(--i,0) * var(--col));width:var(--col);border-radius:10px;background:var(--surface);border:1px solid var(--line-2);transition:left .45s var(--spring)}
.seg button{position:relative;min-width:0;border:0;background:none;padding:6px 2px;border-radius:10px;font-size:clamp(.68rem,2.9vw,.78rem);font-weight:600;color:var(--faint);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.seg button.on{color:var(--gold)}

/* ---------- Dinleme alanı ---------- */
.pslot{flex:none}
.player{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);max-width:560px;margin:0 auto 10px;padding:8px 10px 8px 8px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow)}
.player[hidden]{display:none}
.player .pp{flex:none;position:relative;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--primary-ink);background:var(--primary);transition:transform .3s var(--spring),background .25s;touch-action:manipulation}
.player .pp:hover{background:var(--primary-2)}
.player .pp:active{transform:scale(.92)}
.player .pp svg{grid-area:1/1;width:19px;height:19px;transition:transform .35s var(--spring),opacity .2s}
.player .pp .i-pause{opacity:0;transform:scale(.4) rotate(-45deg)}
.player[data-state="playing"] .pp .i-play,.player[data-state="loading"] .pp .i-play{opacity:0;transform:scale(.4) rotate(45deg)}
.player[data-state="playing"] .pp .i-pause,.player[data-state="loading"] .pp .i-pause{opacity:1;transform:none}
.player .pp::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;opacity:0;pointer-events:none}
.player[data-state="loading"] .pp::after{opacity:1;border-top-color:var(--gold);animation:plSpin .8s linear infinite}
.player[data-state="playing"] .pp::after{opacity:1;border-color:var(--primary);animation:plRing 2s ease-out infinite}
@keyframes plSpin{to{transform:rotate(360deg)}}
@keyframes plRing{from{transform:scale(.86);opacity:.6}to{transform:scale(1.25);opacity:0}}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ptitle{display:flex;align-items:center;gap:8px;min-width:0;font-size:.76rem;font-weight:600;line-height:1.3}
.ptitle>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player[data-state="error"] .ptitle{color:var(--danger)}
.eq{flex:none;display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.eq i{width:2.5px;height:40%;border-radius:2px;background:var(--gold);transform-origin:bottom}
.eq i:nth-child(2){height:100%}.eq i:nth-child(3){height:65%}
.playing .eq i,.player[data-state="playing"] .eq i{animation:plEq .9s ease-in-out infinite}
.playing .eq i:nth-child(2),.player[data-state="playing"] .eq i:nth-child(2){animation-delay:-.3s}
.playing .eq i:nth-child(3),.player[data-state="playing"] .eq i:nth-child(3){animation-delay:-.6s}
@keyframes plEq{50%{transform:scaleY(.35)}}
.prow{display:flex;align-items:center;gap:10px}
.wave{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:24px;cursor:pointer;touch-action:none;border-radius:8px;overflow:hidden}
.wave i{flex:1;min-width:0;height:var(--h,40%);border-radius:99px;background:var(--line-2);transition:background .25s,transform .25s var(--spring)}
.wave i.p{background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.player[data-state="playing"] .wave i.h{transform:scaleY(1.3)}
.ptime{flex:none;font-size:.72rem;font-weight:500;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbtn{flex:none;min-width:38px;height:38px;padding:0 6px;border-radius:12px;border:1px solid var(--line-2);background:transparent;font-weight:600;font-size:.74rem;cursor:pointer;display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:transform .3s var(--spring),border-color .25s,color .25s}
.pbtn:hover{border-color:var(--gold);color:var(--gold)}
.pbtn:active{transform:scale(.9)}
.pbtn .ic{width:18px;height:18px}
#plSpeed{min-width:48px}

/* ---------- Secde ---------- */
.contrast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.contrast>div{padding:16px 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);font-size:.92rem;color:var(--soft)}
.contrast b{display:block;margin-bottom:4px;font-family:var(--font-d);font-size:1.3rem;font-weight:600;color:var(--gold)}
.contrast .ic{width:20px;height:20px;margin:0 auto 6px;color:var(--gold);display:block}
.words{display:grid;gap:8px;margin:6px 0 16px}
.word{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr);align-items:center;gap:14px;padding:8px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);text-align:left}
.word .ar{margin:0;font-size:1.8rem;line-height:1.6;text-align:center}
.word b{font-weight:600}
.word small{display:block;color:var(--soft);font-size:.84rem;line-height:1.4}
.organ-svg{display:block;width:100%;max-height:26vh;margin:0 auto;color:var(--ink)}
.organ-svg .dot{cursor:pointer;stroke:var(--surface);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:dotPulse 2s ease-in-out infinite}
.organ-svg .dot.on{stroke:var(--ink);stroke-width:3;animation:none}
@keyframes dotPulse{50%{transform:scale(1.2)}}
.organ-info{min-height:3.2em;margin:10px auto;font-size:.94rem;color:var(--soft)}
.organ-info b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .3s,border-color .3s,color .3s,transform .3s var(--spring)}
.chips button:active{transform:scale(.93)}
.chips button.on{background:var(--emerald-soft);border-color:var(--emerald);color:var(--emerald)}

/* ---------- Vakitler: rekât çizelgesi ---------- */
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-bottom:16px;font-size:.76rem;font-weight:500;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.k-f{--c:var(--farz)} .k-s{--c:var(--sunnet)} .k-v{--c:var(--vitir)}
.vakits{display:grid;gap:8px;text-align:left}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px 14px;padding:11px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2)}
.vrow .vi{grid-row:span 3;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);color:var(--gold)}
.vrow .vi .ic{width:20px;height:20px}
.vrow h4{margin:0;font-family:var(--font-d);font-size:1.3rem;font-weight:600;line-height:1}
.vrow .vt{font-size:.74rem;font-weight:600;letter-spacing:.04em;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.vbeads{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:5px 11px}
.vbeads span{display:inline-flex;gap:4px}
.vbeads i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.slide.cur .vbeads i{animation:beadIn .5s var(--spring) both;animation-delay:calc(var(--j) * 35ms + 150ms)}
.vcap{grid-column:2 / -1;font-size:.76rem;line-height:1.4;color:var(--faint)}
.vcap span{font-weight:600;color:var(--c)}
@keyframes beadIn{from{transform:scale(0)}}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.totals div{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:8px 6px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}
.totals b{font-family:var(--font-d);font-size:1.7rem;font-weight:600;line-height:1;color:var(--c)}
.totals span{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:10px;height:150px;margin:8px 0 6px}
.cols div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.cols i{width:100%;max-width:54px;height:calc(var(--v) * 25%);border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,var(--farz),color-mix(in srgb,var(--farz) 45%,transparent));transform-origin:bottom}
.slide.cur .cols i{animation:colIn .8s var(--ease) both;animation-delay:calc(var(--j) * 90ms + 150ms)}
@keyframes colIn{from{transform:scaleY(0)}}
.cols b{font-family:var(--font-d);font-size:1.5rem;font-weight:600;line-height:1}
.colnames{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;font-size:.74rem;font-weight:600;color:var(--soft)}
.sum{margin-top:16px;font-family:var(--font-d);font-size:1.5rem;font-weight:500}
.sum b{color:var(--gold);font-weight:700;font-size:1.25em}

/* ---------- Nafile ---------- */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.facts div{padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2)}
.facts b{display:block;margin-bottom:3px;font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.facts span{font-size:.9rem;line-height:1.45}
.rtable{display:grid;gap:6px;text-align:left}
.rtable li{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:12px;padding:9px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:.92rem}
.rtable b{font-family:var(--font-d);font-size:1.2rem;font-weight:600}
.rtable em{font-style:normal;color:var(--soft);font-size:.8rem}

/* ---------- Alt panel ---------- */
.sheet-bg{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(4,10,8,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-bg.on{display:flex;animation:fadeIn .25s both}
.sheet-bg.out{animation:fadeOut .22s both}
.sheet{width:100%;max-width:640px;max-height:84vh;max-height:84dvh;overflow-y:auto;overscroll-behavior:contain;padding:14px 22px 28px;padding-bottom:max(28px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;border:1px solid var(--line-2);border-bottom:0;background:var(--surface);box-shadow:0 -30px 60px -30px rgba(0,0,0,.6);animation:up .45s var(--ease) both}
.sheet-bg.out .sheet{animation:down .22s ease-in both}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes up{from{transform:translateY(60%);opacity:0}}
@keyframes down{to{transform:translateY(40%);opacity:0}}
.sheet .grab{width:44px;height:4px;border-radius:9px;background:var(--line-2);margin:0 auto 12px}
.sheet .x{float:right;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);background:transparent;cursor:pointer;transition:transform .3s var(--spring),color .25s,border-color .25s}
.sheet .x:hover{transform:rotate(90deg);color:var(--gold);border-color:var(--gold)}
.sheet .x .ic{width:16px;height:16px}
.sheet h3{font-family:var(--font-d);font-size:1.6rem;font-weight:600;line-height:1.2;margin:18px 0 6px}
.sheet h3:first-child{margin-top:4px}
.sheet p{color:var(--soft);font-size:.95rem}
.sheet p+p{margin-top:10px}
.sheet .amin{margin-top:22px;text-align:center;font-family:var(--font-d);font-style:italic;font-size:1.25rem;color:var(--gold)}
.sw{display:flex;align-items:center;gap:14px;margin:14px 0;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .knob{flex:none;position:relative;width:46px;height:28px;border-radius:99px;background:var(--line-2);transition:background .25s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.sw input:checked+.knob{background:var(--emerald)}
.sw input:checked+.knob::after{transform:translateX(18px)}
.sw input:focus-visible+.knob{outline:2px solid var(--gold);outline-offset:3px}
.sw b{display:block;font-weight:600;line-height:1.3}
.sw small{color:var(--soft)}
.voice{display:grid;grid-template-columns:auto repeat(2,minmax(0,1fr));align-items:center;gap:6px;margin:14px 0 0;padding:5px 5px 5px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2)}
.voice span{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-right:6px}
.voice button{min-height:40px;padding:0 10px;border-radius:12px;border:1px solid transparent;background:transparent;font-weight:600;font-size:.88rem;color:var(--soft);cursor:pointer;transition:background .25s,border-color .25s,color .25s,transform .2s}
.voice button:active{transform:scale(.96)}
.voice button[aria-pressed="true"]{background:var(--surface);border-color:var(--gold);color:var(--gold)}
.trks{display:grid;gap:6px}
.trk{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 14px 9px 9px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:600;text-align:left;cursor:pointer;transition:border-color .25s,background .25s,transform .2s}
.trk:active{transform:scale(.985)}
.trk:disabled{opacity:.4;cursor:default}
.trk .n{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);font-size:.78rem;color:var(--soft)}
.trk .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .du{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:500;color:var(--soft);font-variant-numeric:tabular-nums}
.trk .eq{display:none}
.trk.on{border-color:var(--gold);background:var(--gold-soft)}
.trk.on .n{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.trk.on .eq{display:inline-flex}

/* Görünüm paneli: tema ve renk seçimi */
.optrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 4px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:18px;border:1px solid var(--line-2);background:transparent;text-align:left;cursor:pointer;transition:border-color .25s,background .25s,transform .3s var(--spring)}
.opt:active{transform:scale(.97)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt b{font-weight:600;line-height:1.2}
.opt small{color:var(--soft);font-size:.8rem;line-height:1.4}
.opt .sws{display:flex;gap:5px}
.opt .sws i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}

/* tema geçişi: düğmeden yayılan daire */
.theme-vt::view-transition-old(root),.theme-vt::view-transition-new(root){animation:none;mix-blend-mode:normal}
.theme-vt::view-transition-new(root){z-index:2}
@view-transition{navigation:auto}

/* ---------- Geniş ekran: yan menülü yerleşim ---------- */
@media (min-width:700px){
  .sc{padding:36px 40px 32px}
  .more{bottom:-32px;margin:10px -40px -32px !important}
  .tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ibtn .lbl{display:inline}
  .ibtn{padding:0 14px}
}
@media (min-width:1000px) and (min-height:600px){
  body{display:grid;place-items:center}
  .app{width:calc(100% - 48px);max-width:1260px;height:min(calc(100dvh - 48px),940px);grid-template-columns:286px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"brand main" "nav main" "tools main";
    border-radius:32px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--bg-2) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 50px 100px -50px rgba(0,0,0,.6)}
  .app::before{content:"";grid-column:1;grid-row:1 / -1;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent)}
  header.top{display:contents}
  .brandbox{grid-area:brand;align-items:flex-start;gap:14px;padding:30px 26px 22px}
  .brand{font-size:1.72rem;white-space:normal}
  .brand small{display:block}
  .hsub{display:none}
  .tools{grid-area:tools;margin:0;padding:16px 22px 24px;border-top:1px solid var(--line);z-index:1}
  .tools .ibtn{flex:1}
  .ibtn{height:44px}
  nav.tabbar{grid-area:nav;display:flex;flex-direction:column;gap:4px;align-content:start;padding:6px 14px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;overflow-y:auto}
  nav.tabbar::before{top:calc(6px + var(--tab,0) * 62px);left:14px;width:calc(100% - 28px);height:58px;border-radius:16px;transition:top .5s var(--spring)}
  nav.tabbar button{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-content:center;align-items:center;justify-items:start;gap:1px 14px;height:58px;padding:0 16px;font-size:.95rem;text-align:left;color:var(--soft)}
  nav.tabbar button .ic{grid-row:span 2;width:21px;height:21px}
  nav.tabbar button small{display:block;font-size:.72rem;font-weight:500;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabbar button.on{color:var(--ink)}
  nav.tabbar button.on .ic{color:var(--gold);transform:none}
  main{padding-top:22px}
  .track{--g:76px}
  .ctrl{padding-bottom:22px}
  .stepper{padding-bottom:12px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:28px;border-bottom:1px solid var(--line-2);max-height:min(84vh,780px)}
  .sheet .grab{display:none}
}
@media (max-width:420px){
  .ptime .tot{display:none}
  .player{gap:9px}
  .pbtn{min-width:34px;height:34px;border-radius:11px}
  #plSpeed{min-width:44px;font-size:.7rem}
  .brand{font-size:1.24rem}
}
@media (max-width:380px){.hsub{display:none}.tools{margin-left:auto}}
@media (max-width:699px){
  .tiles{gap:8px}
  .tile{padding:12px 10px;gap:4px}
  .tile .ti{width:34px;height:34px}
  .tile .ti .ic{width:17px;height:17px}
  .tile small{font-size:.75rem;line-height:1.35}
  .vrow{padding:9px 12px}
  .vakits{gap:6px}
}
@media (max-height:660px){
  .player{margin-bottom:6px;padding:5px 8px 5px 6px}
  .player .pp{width:38px;height:38px}
  .ptitle{display:none}
  .pose{padding:16px 12px 8px;margin-bottom:12px}
  .pose svg{height:22vh}
  .sc{padding:20px 18px 18px}
  .more{bottom:-18px;margin:10px -18px -18px !important}
  .stepper{padding-bottom:6px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.001ms !important}
  .slide{transform:none}
}

   ========================================================= */
const decks={};
function createDeck(hostId,slides,o={}){
  const host=$(hostId), n=slides.length;
  host.innerHTML=`<div class="deck"><div class="track">${slides.map((s,i)=>`<section class="slide" aria-label="${i+1} / ${n}"><div class="sc ${s.cls||''}">${s.html}</div></section>`).join('')}</div>
   <div class="ctrl"><button class="nb prev" aria-label="Önceki kart">${ic('left')}</button><div class="pos">${n<=12?'<div class="dots"></div>':'<div class="bar"><b></b></div>'}<small class="cnt"></small></div><button class="nb next" aria-label="Sonraki kart">${ic('right')}</button></div></div>`;
  const track=host.querySelector('.track'), prev=host.querySelector('.prev'), next=host.querySelector('.next'),
        dots=host.querySelector('.dots'), bar=host.querySelector('.bar b'), cnt=host.querySelector('.cnt');
  let idx=0;
  const unit=()=>{const s=track.children[0];return s?s.offsetWidth+(parseFloat(getComputedStyle(track).columnGap)||0):1};
  function upd(){
    for(let i=0;i<n;i++) track.children[i].classList.toggle('cur',i===idx);
    if(dots) dots.innerHTML=slides.map((_,i)=>`<i class="${i===idx?'on':''}" data-i="${i}"></i>`).join('');
    if(bar) bar.style.width=((idx+1)/n*100)+'%';
    cnt.textContent=`${idx+1} / ${n}`+(slides[idx].label?` · ${slides[idx].label}`:'');
    prev.disabled=idx===0;
    const end=idx===n-1&&o.onEnd;
    next.className='nb next'+(end?' wide':''); next.innerHTML=end?`${o.endLabel||'Devam'}${ic('arrow')}`:ic('right');
    next.setAttribute('aria-label',end?(o.endLabel||'Devam'):'Sonraki kart');
    next.disabled=idx===n-1&&!o.onEnd;
    o.onChange&&o.onChange(idx,slides[idx]);
  }
  track.addEventListener('scroll',()=>{const i=Math.max(0,Math.min(n-1,Math.round(track.scrollLeft/unit())));if(i!==idx){idx=i;upd()}},{passive:true});
  const go=(i,instant)=>{i=Math.max(0,Math.min(n-1,i));track.scrollTo({left:i*unit(),behavior:instant||reduceMotion.matches?'auto':'smooth'});if(i!==idx){idx=i;upd()}};
  prev.onclick=()=>go(idx-1);
  next.onclick=()=>{if(idx===n-1&&o.onEnd)o.onEnd();else go(idx+1)};
  if(dots) dots.onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
  requestAnimationFrame(markMore);
  upd();
  const d={go,get idx(){return idx},slides,refresh(){track.scrollLeft=idx*unit()}};
  decks[hostId]=d; return d;
}
function markMore(){
  document.querySelectorAll('.sc').forEach(sc=>{
    let m=sc.querySelector(':scope > .more');
    const need=sc.scrollHeight>sc.clientHeight+6;
    if(need&&!m){m=document.createElement('div');m.className='more';m.textContent='Devamı aşağıda';sc.appendChild(m);
      sc.addEventListener('scroll',()=>m.classList.toggle('gone',sc.scrollTop+sc.clientHeight>=sc.scrollHeight-8),{passive:true});}
  });
}
window.addEventListener('resize',markMore);

{e:'🧍',t:'Kıyam',tt:'Kıyam ve Sübhâneke',pose:'kiyam',short:'Ayakta, saygıyla durup Allah\'ı övmek.',
 doing:['Erkekler ellerini göbeğin altında bağlar: sağ elin avucu sol elin üstüne gelir, sağ el sol bileği kavrar.','Kadınlar ellerini göğüs üzerine koyar.','Gözler secde edilecek yere bakar.','Sübhâneke okunur.'],
 says:[{h:'Sübhâneke',ar:'سُبْحَانَكَ اللّٰهُمَّ وَبِحَمْدِكَ وَتَبَارَكَ اسْمُكَ وَتَعَالٰى جَدُّكَ وَلَا إِلٰهَ غَيْرُكَ',ok:'Sübhânekellâhümme ve bi hamdik ve tebârekesmük ve teâlâ ceddük ve lâ ilâhe ğayrük.',mn:'Allah\'ım! Seni her türlü eksiklikten uzak tutar, sana hamd ederim. Senin adın mübarektir, şanın yücedir. Senden başka ilah yoktur.',note:'Sübhâneke sadece ilk rekâtta okunur.'}],
 dikkat:['Kıbleden dönmeden, dimdik ve sakin dur.','Gözlerini secde yerinden ayırma; etrafa bakma.','Kaşınmak, oynamak gibi gereksiz hareketlerden kaçın.'],
 hikmet:[['ayet','"Allah\'a gönülden boyun eğerek ayakta durun." Kıyam, saygı ve itaatle Allah\'ın huzurunda durmaktır.','Bakara 2/238'],
         ['ayet','"Mü\'minler kurtuluşa ermiştir; onlar ki namazlarında huşû içindedirler." Huşû, kalbin ve bedenin saygıyla sakinleşmesidir.','Mü\'minûn 23/1-2'],
         ['yorum','Âlimler, gözün secde yerine bakmasının kalbin dağılmamasına ve huşûya yardım ettiğini söylemişlerdir.']],
 memo:'Sübhâneke, namazın "Merhaba Rabbim!" kısmıdır: Önce Allah\'ı övüyoruz.',memoY:'Namaz övgüyle başlar: Sübhâneke ile Rabbimizi tesbih eder, O\'na hamd ederiz.'},

{e:'📖',t:'Kıraat',tt:'Kıraat: Fâtiha ve Sure',pose:'kiyam',short:'Ayakta Kur\'an okumak.',
 doing:['Önce Eûzü ve Besmele çekilir.','Fâtiha sûresi okunur.','Ardından kısa bir sure veya en az üç kısa âyet okunur (zamm-ı sure).','Cemaatle kılarken imam okur, cemaat sessizce dinler.'],
 says:[
  {h:'Eûzü',ar:'أَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيمِ',ok:'Eûzü billâhi mineş-şeytânir-racîm.',mn:'Kovulmuş şeytanın şerrinden Allah\'a sığınırım.'},
  {h:'Besmele',ar:'بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ',ok:'Bismillâhirrahmânirrahîm.',mn:'Rahmân ve Rahîm olan Allah\'ın adıyla.'},
  {fatiha:true},
  {h:'İhlâs Sûresi',sub:'Zamm-ı sure örneği',ar:'قُلْ هُوَ اللّٰهُ أَحَدٌ ۝ اَللّٰهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',ok:'Kul hüvallâhü ehad. Allâhüs-samed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad.',mn:'De ki: O Allah birdir. Allah her şeyden müstağnidir, her şey O\'na muhtaçtır. O doğurmamış ve doğmamıştır. Hiçbir şey O\'na denk değildir.'},
  {h:'Kevser Sûresi',sub:'Zamm-ı sure örneği',ar:'إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ۝ فَصَلِّ لِرَبِّكَ وَانْحَرْ ۝ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ',ok:'İnnâ a\'taynâkel-kevser. Fe salli li-rabbike venhar. İnne şânieke hüvel-ebter.',mn:'Şüphesiz biz sana Kevser\'i (pek çok hayrı) verdik. Öyleyse Rabbin için namaz kıl ve kurban kes. Asıl soyu kesik olan, sana kin besleyendir.'}],
 dikkat:['Fâtiha\'yı acele etmeden, harfleri düzgün çıkararak oku.','Fâtiha bitince içinden "Âmîn" de.','Farz namazların 3. ve 4. rekâtlarında sadece Fâtiha okunur.'],
 hikmet:[['hadis','Peygamberimiz "<b>Fâtiha\'yı okumayanın namazı olmaz</b>" buyurmuştur. Bu yüzden Fâtiha her rekâtta okunur.','Buhârî, Ezân; Müslim, Salât'],
         ['hadis','Kudsî bir hadiste Allah, namazdaki Fâtiha\'yı kendisiyle kulu arasında paylaştırdığını ve kulun her âyetine cevap verdiğini bildirir. Fâtiha kartlarındaki karşılıklar bu hadise dayanır. Fâtiha okuyan kul, Rabbine hitap etmektedir.','Müslim, Salât']],
 memo:'Fâtiha bir sohbettir: Sen bir âyet okursun, Allah sana cevap verir! 💬',memoY:'Fâtiha bir muhataplıktır: Kul her âyeti okudukça Allah ona karşılık verir.'},

{e:'🙇',t:'Rükû',pose:'ruku',short:'Allah\'ın büyüklüğü karşısında saygıyla eğilmek.',
 doing:['"Allahu Ekber" diyerek eğilinir.','Eller dizlere konur; erkekler parmaklarını açarak dizleri kavrar.','Sırt ve baş aynı hizada, dümdüz olur.','En az 3 kere tesbih okunur.'],
 says:[{h:'Rükû Tesbihi',ar:'سُبْحَانَ رَبِّيَ الْعَظِيمِ',ok:'Sübhâne Rabbiye\'l-Azîm.',mn:'<b>Büyük</b> Rabbimi her türlü eksiklikten uzak tutarım.',note:'En az 3 kere söylemek sünnettir.'}],
 dikkat:['Başını ne yukarı kaldır ne de aşağı sarkıt; sırtınla düz olsun.','Dizler dik olsun, bükülmesin.','Organlar yerine oturana kadar bekle; hemen kalkma (ta\'dîl-i erkân).'],
 hikmet:[['ayet','"Ey iman edenler! Rükû edin, secde edin ve Rabbinize ibadet edin."','Hac 22/77'],
         ['hadis','Hz. Âişe anlatır: Peygamberimiz rükû yaptığında başını ne yukarı kaldırır ne de aşağı indirirdi; ikisinin arasında, dümdüz tutardı.','Müslim, Salât'],
         ['hadis','"Sübhâne Rabbiye\'l-Azîm" sözü rükûya şöyle yerleşti: Vâkıa sûresindeki "Büyük Rabbinin adını tesbih et" âyeti inince Peygamberimiz "Bunu rükûnuzda söyleyin" buyurdu.','Ebû Dâvûd, Salât; İbn Mâce, İkâmetü\'s-salât'],
         ['yorum','Âlimler, rükûnun büyüklere saygı için eğilme şekli olduğunu, bu yüzden burada Allah\'ın "azîm" (en büyük) sıfatının anıldığını açıklamışlardır. Gerçek büyüklük sadece O\'na aittir.']],
 memo:'Rükûda "AZÎM": Allah çok BÜYÜK, ben saygıyla eğiliyorum. Sırtım masa gibi düz! 📏',memoY:'Rükûda "Azîm": Büyük olan Allah\'tır; kul O\'nun huzurunda saygıyla eğilir.'},

{e:'🧍‍♂️',t:'Kavme',tt:'Kavme (Rükûdan Doğrulma)',pose:'kavme',short:'Rükûdan kalkıp tam dik durmak.',
 doing:['"Semiallâhü limen hamideh" diyerek doğrulunur.','Tam dik durulunca "Rabbenâ lekel-hamd" denir.','Eller yanlara salınır.'],
 says:[{h:'Doğrulurken',ar:'سَمِعَ اللّٰهُ لِمَنْ حَمِدَهُ',ok:'Semiallâhü limen hamideh.',mn:'Allah, kendisine hamd edeni işitir.'},
       {h:'Dik durunca',ar:'رَبَّنَا لَكَ الْحَمْدُ',ok:'Rabbenâ lekel-hamd.',mn:'Rabbimiz! Hamd sana mahsustur.'}],
 dikkat:['Tam dik dur, sonra secdeye in. Yarım kalkıp secdeye gitme.','Cemaatle kılarken imam "Semiallâhü..." der, cemaat "Rabbenâ lekel-hamd" der.'],
 hikmet:[['hadis','Peygamberimiz, imam "Semiallâhü limen hamideh" deyince "Rabbenâ lekel-hamd" demeyi öğretmiştir. Kimin sözü meleklerin sözüne denk gelirse geçmiş günahlarının bağışlanacağını bildirmiştir.','Buhârî, Ezân'],
         ['hadis','Namazını acele kılan bir adama Peygamberimiz "Dön, tekrar kıl; çünkü sen namaz kılmadın" dedi. Sonra ona her hareketi sakinleşerek ve tam doğrularak yapmayı öğretti.','Buhârî, Ezân; Müslim, Salât']],
 memo:'Allah seni işitiyor! Sen de "Hamd sana Rabbim!" diye cevap ver. 👂',memoY:'Allah, hamd edeni işitir; kul da "Rabbimiz, hamd sanadır" diyerek karşılık verir.'},

{e:'🤲',t:'Secde',pose:'secde',short:'Alnı yere koyup Allah\'ın yüceliğini anmak. Ayrıntılar "Secde" bölümünde.',
 doing:['"Allahu Ekber" diyerek secdeye inilir.','Önce dizler, sonra eller, sonra burun ve alın yere konur.','Eller kulak hizasında, parmaklar bitişik ve kıbleye doğru.','Ayak parmakları kıbleye doğru bükülür.','En az 3 kere tesbih okunur.'],
 says:[{h:'Secde Tesbihi',ar:'سُبْحَانَ رَبِّيَ الْأَعْلٰى',ok:'Sübhâne Rabbiye\'l-A\'lâ.',mn:'<b>En yüce</b> Rabbimi her türlü eksiklikten uzak tutarım.',note:'En az 3 kere söylemek sünnettir.'}],
 dikkat:['Yedi organ yere değmeli: alın (burunla birlikte), iki el, iki diz, iki ayağın parmakları.','Kollarını yere yayma.','Erkekler kollarını yanlardan, karnını uyluklardan ayırır; kadınlar toplu durur.','Acele etme, sakinleşene kadar dur.'],
 hikmet:[['ayet','"Secde et ve yaklaş."','Alak 96/19'],
         ['hadis','"Kulun Rabbine en yakın olduğu an, secdede olduğu andır."','Müslim, Salât'],
         ['hadis','A\'lâ sûresinin ilk âyeti inince Peygamberimiz "Bunu secdenizde söyleyin" buyurdu.','Ebû Dâvûd, Salât; İbn Mâce, İkâmetü\'s-salât'],
         ['yorum','Âlimler şöyle açıklar: İnsan secdede en alçak hâldedir; bu yüzden en uygun söz, Allah\'ın "en yüce" olduğunu söylemektir.']],
 memo:'Alnım yerde ⬇️ Rabbim en yüce ⬆️ Ve ben O\'na en yakınım! 💛',memoY:'Alın yerde, dil "en yüce Rabbim" der; kul bu anda Rabbine en yakındır.',secdeLink:true},

{e:'🧎',t:'Celse',tt:'Celse (İki Secde Arası)',pose:'celse',short:'İki secde arasında kısa bir oturuş.',
 doing:['"Allahu Ekber" diyerek secdeden başı kaldırıp oturulur.','Eller uylukların üzerine konur.','Bir "Sübhânallah" diyecek kadar oturulur, sonra "Allahu Ekber" ile ikinci secdeye gidilir.'],
 says:[{h:'Söylenebilecek dua',ar:'رَبِّ اغْفِرْ لِي',ok:'Rabbiğfirlî.',mn:'Rabbim, beni bağışla.',note:'Peygamberimizin iki secde arasında "Rabbiğfirlî" dediği rivayet edilmiştir (Ebû Dâvûd, Salât; İbn Mâce, İkâmetü\'s-salât). Hanefîlere göre bu özellikle nafile namazlarda güzeldir.'}],
 dikkat:['Başını kaldırıp hemen yere geri koyma; önce tam otur.','Oturuşta sakin ol, sonra ikinci secdeye git.'],
 hikmet:[['hadis','Namazını acele kılan adama Peygamberimiz, secdeden kalkıp oturuşta sakinleşmesini de öğretmiştir.','Buhârî, Ezân; Müslim, Salât'],
         ['hadis','"Hırsızlığın en kötüsü, namazından çalandır." Sahâbe "Namazdan nasıl çalınır?" diye sorunca Peygamberimiz "Rükûsunu ve secdesini tam yapmamaktır" buyurdu.','Muvatta, Kasru\'s-salât; Ahmed b. Hanbel, Müsned']],
 memo:'Celse bir "mola" değil, bir basamak: Otur, sakinleş, bağışlanma dile. 🌿',memoY:'Celse bir ara değil, namazın bir parçasıdır: Tam otur, sükûnet bul, bağışlanma dile.'},

{e:'🤲',t:'2. Secde',tt:'İkinci Secde',pose:'secde',short:'Birinci secde gibi tekrar secdeye kapanmak.',
 doing:['"Allahu Ekber" diyerek tekrar secdeye inilir.','Birinci secdedeki gibi yapılır ve en az 3 kere tesbih söylenir.','Sonra "Allahu Ekber" ile ya ayağa kalkılır ya da oturulur.'],
 says:[{h:'Secde Tesbihi',ar:'سُبْحَانَ رَبِّيَ الْأَعْلٰى',ok:'Sübhâne Rabbiye\'l-A\'lâ.',mn:'En yüce Rabbimi her türlü eksiklikten uzak tutarım.'}],
 dikkat:['Her rekâtta iki secde vardır; ikisi de farzdır.','Ayağa kalkarken önce alın, sonra eller, sonra dizler yerden kaldırılır.'],
 hikmet:[['hadis','Allah için yapılan her secde ile Allah kulunu bir derece yükseltir ve bir günahını siler.','Müslim, Salât'],
         ['yorum','Neden iki secde? Asıl sebep Peygamberimizin böyle kılmasıdır. Bazı âlimler, "Sizi topraktan yarattık, oraya döndüreceğiz ve bir kez daha oradan çıkaracağız" âyetine işaret etmiştir: İlk secde yaratılışı, ikincisi toprağa dönüşü hatırlatır.','Tâhâ 20/55']],
 memo:'Bir rekâtta 1 rükû + 2 secde var. "Bir eğil, iki kapan!" ✌️',memoY:'Her rekâtta bir rükû ve iki secde vardır; ikisi de aynı huşû ile yapılır.'},

{e:'🧎‍♂️',t:'Oturuş',tt:'Ka\'de (Oturuş)',pose:'kade',short:'İkinci ve son rekâtlarda oturup dua etmek.',
 doing:['Erkekler sol ayağını yatırıp üzerine oturur, sağ ayağını dik tutar, parmakları kıbleye bakar.','Kadınlar ayaklarını sağ tarafa çıkarıp yere oturur.','Eller uylukların üzerinde, parmak uçları diz hizasında olur.','İlk oturuşta sadece Tahiyyat, son oturuşta Tahiyyat, Salli, Bârik ve Rabbenâ duaları okunur.'],
 says:[
  {h:'Tahiyyat',sub:'Ettehiyyâtü',ar:'اَلتَّحِيَّاتُ لِلّٰهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، اَلسَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ، اَلسَّلَامُ عَلَيْنَا وَعَلٰى عِبَادِ اللّٰهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ',ok:'Ettehiyyâtü lillâhi vessalevâtü vettayyibât. Esselâmü aleyke eyyühen-nebiyyü ve rahmetullâhi ve berekâtüh. Esselâmü aleynâ ve alâ ibâdillâhis-sâlihîn. Eşhedü en lâ ilâhe illallâh ve eşhedü enne Muhammeden abdühû ve rasûlüh.',mn:'Her türlü saygı, dua ve güzel sözler Allah\'a aittir. Ey Peygamber! Selam, Allah\'ın rahmeti ve bereketi senin üzerine olsun. Selam bizim ve Allah\'ın bütün iyi kullarının üzerine olsun. Şahitlik ederim ki Allah\'tan başka ilah yoktur; yine şahitlik ederim ki Muhammed O\'nun kulu ve elçisidir.'},
  {h:'Salli',ar:'اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ وَعَلٰى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلٰى إِبْرَاهِيمَ وَعَلٰى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ',ok:'Allâhümme salli alâ Muhammedin ve alâ âli Muhammed, kemâ salleyte alâ İbrâhîme ve alâ âli İbrâhîm, inneke hamîdün mecîd.',mn:'Allah\'ım! İbrâhim\'e ve ailesine rahmet ettiğin gibi, Muhammed\'e ve ailesine de rahmet et. Şüphesiz sen övülmeye layıksın, şanı yüce olansın.'},
  {h:'Bârik',ar:'اَللّٰهُمَّ بَارِكْ عَلٰى مُحَمَّدٍ وَعَلٰى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلٰى إِبْرَاهِيمَ وَعَلٰى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ',ok:'Allâhümme bârik alâ Muhammedin ve alâ âli Muhammed, kemâ bârakte alâ İbrâhîme ve alâ âli İbrâhîm, inneke hamîdün mecîd.',mn:'Allah\'ım! İbrâhim\'e ve ailesine bereket verdiğin gibi, Muhammed\'e ve ailesine de bereket ver. Şüphesiz sen övülmeye layıksın, şanı yüce olansın.'},
  {h:'Rabbenâ Âtinâ',ar:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',ok:'Rabbenâ âtinâ fid-dünyâ haseneten ve fil-âhirati haseneten ve kınâ azâben-nâr.',mn:'Rabbimiz! Bize dünyada da iyilik ver, âhirette de iyilik ver ve bizi cehennem azabından koru.',note:'Bakara 2/201'},
  {h:'Rabbenağfirlî',ar:'رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ',ok:'Rabbenağfirlî ve li-vâlideyye ve lil-mü\'minîne yevme yekûmül-hisâb.',mn:'Rabbimiz! Hesap gününde beni, annemi, babamı ve bütün mü\'minleri bağışla.',note:'İbrâhim 14/41: Hz. İbrâhim\'in duası.'}],
 dikkat:['Son oturuşta Tahiyyat okuyacak kadar oturmak farzdır.','3-4 rekâtlı namazların ilk oturuşunda Tahiyyattan sonra hemen kalkılır.','Oturuşta gözler kucağa bakar.'],
 hikmet:[['hadis','İbn Mes\'ûd anlatır: Peygamberimiz Tahiyyatı ona, Kur\'an\'dan bir sure öğretir gibi, eli elinin içindeyken öğretti.','Buhârî, İsti\'zân; Müslim, Salât'],
         ['hadis','"Esselâmü aleynâ ve alâ ibâdillâhis-sâlihîn" dediğinde bu selam, gökte ve yerde Allah\'ın bütün iyi kullarına ulaşır. Tek başına kılan kişi de bütün salih kullara selam vermiş olur.','Buhârî, Ezân; Müslim, Salât'],
         ['ayet','"Allah ve melekleri Peygamber\'e salât eder. Ey iman edenler! Siz de ona salât ve selam getirin." Salli ve Bârik bu emre uymaktır.','Ahzâb 33/56'],
         ['hadis','Sahâbîler "Sana nasıl salavat getirelim?" diye sorunca Peygamberimiz onlara Salli ve Bârik dualarını öğretti.','Buhârî, Enbiyâ; Müslim, Salât']],
 memo:'Tahiyyat = Allah\'a saygı + Peygamberimize selam + bütün iyilere selam + şahadet. 🎁',memoY:'Tahiyyat: Allah\'a tazim, Peygamberimize selam, bütün salih kullara selam ve şehadet.'},

{e:'👋',t:'Selam',pose:'selam',short:'Önce sağa, sonra sola selam vererek namazı bitirmek.',
 doing:['Baş önce sağa çevrilir, göz omuza bakar ve selam verilir.','Sonra sola çevrilir ve yine selam verilir.','Namaz böylece tamamlanır.'],
 says:[{h:'Selam',ar:'اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ',ok:'Esselâmü aleyküm ve rahmetullâh.',mn:'Selam ve Allah\'ın rahmeti üzerinize olsun.'}],
 dikkat:['Selam, başı çevirerek verilir; göz omuza bakar.','Selamdan sonra hemen kalkmayıp tesbihat yapmak güzeldir.'],
 hikmet:[['hadis','Peygamberimiz namazın bitişinin (tahlîl) selam olduğunu bildirmiştir. Tekbirle kapanan kapı, selamla açılır.','Tirmizî, Tahâret; Ebû Dâvûd, Tahâret'],
         ['yorum','Hanefî âlimler, selam verirken sağdaki ve soldaki meleklere ve cemaatteki kardeşlere selam vermeye niyet etmeyi tavsiye etmişlerdir. Rabbimizin huzurundan herkese barış ve rahmet dileyerek çıkıyoruz.'],
         ['ayet','"Namaz, insanı hayâsızlıktan ve kötülükten alıkoyar." Namaz biter ama güzel etkisi gün boyu sürer.','Ankebût 29/45']],
 memo:'Selam = "Namaz bitti, iyilik başladı!" Sağa selam, sola selam, herkese rahmet. 🕊️',memoY:'Namaz selamla tamamlanır; kul huzurdan herkese esenlik ve rahmet dileyerek ayrılır.'}

function sayCard(s,i,n){
  return `${kick('Okunuş'+(n>1?` · ${i+1}/${n}`:''))}<h3>${s.h}</h3>${s.sub?`<p class="soft" style="margin:-6px 0 8px">${s.sub}</p>`:''}
   ${s.ar?`<div class="ar">${s.ar}</div>`:''}<div class="okunus">${s.ok}</div>
   <div class="mean"><span class="lb">Anlamı</span>${s.mn}</div>${s.note?`<p class="note">${s.note}</p>`:''}`;
}
function stepSlides(k){
  const s=STEPS[k], out=[];
  out.push({g:'hareket',label:'Hareket',cls:'hero',html:`${kick(`${k+1}. durak`)}<div class="pose">${fig(s.pose)}</div><h2>${emo(s.e)}${s.tt||s.t}</h2><p class="lead">${s.short}</p>`});
  out.push({g:'hareket',label:'Ne yapıyoruz?',html:`${kick('Hareket')}<div class="pose sm">${fig(s.pose)}</div><h3>Ne yapıyoruz?</h3><ul class="list">${s.doing.map(d=>`<li>${d}</li>`).join('')}</ul>`});
  const says=[]; s.says.forEach(x=>{ if(x.fatiha){ FATIHA.forEach((v,j)=>says.push({fat:v,j})) } else says.push(x) });
  says.forEach((x,i)=>{
    if(x.fat){ const v=x.fat;
      out.push({g:'soz',label:`Fâtiha ${x.j+1}/${FATIHA.length}`,html:`${kick(`Fâtiha · ${x.j+1}/${FATIHA.length}`)}<div class="ar">${v.ar}</div><div class="okunus">${v.ok}</div><div class="mean"><span class="lb">Anlamı</span>${v.mn}</div>
        <div class="ans"><span class="lb">Kudsî hadiste karşılığı</span>"${v.c}"</div>
        ${x.j===FATIHA.length-1?'<p class="note">Karşılıklar kudsî hadisten alınmıştır (Müslim, Salât). Son âyetlerin karşılığı birlikte verilmiştir.</p>':''}`});
    } else out.push({g:'soz',label:x.h,html:sayCard(x,i,says.length)});
  });
  out.push({g:'dikkat',label:'Dikkat',html:`${kick('Dikkat')}<h3>Nelere dikkat ediyoruz?</h3><ul class="list warn">${s.dikkat.map(d=>`<li>${d}</li>`).join('')}</ul>`});
  s.hikmet.forEach((h,i)=>out.push({g:'hikmet',label:`Hikmet ${i+1}/${s.hikmet.length}`,html:`${kick(`Hikmet · ${i+1}/${s.hikmet.length}`)}${hk(h[0],h[1],h[2])}`}));
  out.push({g:'memo',label:T('Akılda kalsın','Özet'),cls:'memo',html:`${kick(T('Akılda kalsın','Özetle'))}<blockquote class="quote">${T(s.memo,s.memoY)}</blockquote>
    ${s.secdeLink?`<div class="btns"><button class="btn alt" data-go="secde">${ic('sajda')}Secde bölümüne git</button></div>`:''}
    <p class="note">${k<STEPS.length-1?`Sıradaki durak: <b>${STEPS[k+1].tt||STEPS[k+1].t}</b>`:T('Namazın bütün duraklarını tamamladın!','Namazın bütün duraklarını tamamladınız.')}</p>`});
  return out;
}

function nafileSlides(k){
  const s=NAFILE[k], out=[];
  out.push({g:'tanim',label:'Tanım',cls:'hero',html:`${kick(k?`Nafile · ${k}/${NAFILE.length-1}`:'Nafile')}<h2>${emo(s.e)}${s.tt}</h2>${s.sub?`<p class="okunus" style="margin:-6px 0 12px">${s.sub}</p>`:''}<p class="lead">${s.short}</p>
    <div class="facts">${s.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>`});
  (s.tanim||[]).forEach(h=>out.push({g:'tanim',label:'Tanım',html:h}));
  s.delil.forEach((h,i)=>out.push({g:'delil',label:`Delil ${i+1}/${s.delil.length}`,html:`${kick(`Delil · ${i+1}/${s.delil.length}`)}${hk(h[0],h[1],h[2])}`}));
  out.push({g:'nasil',label:'Uygulama',html:`${kick('Uygulama')}<h3>${k?'Nasıl kılınır?':'Genel esaslar'}</h3><ul class="list">${s.nasil.map(d=>`<li>${d}</li>`).join('')}</ul>`});
  (s.extra||[]).forEach(h=>out.push({g:'nasil',label:'Uygulama',html:h}));
  return out;
}

/* Seslendiren: yetişkin temasında erkek ses (varsayılan) ya da kadın ses seçilebilir; çocuk temasında hep kadın ses çalar.
   Kaydı olmayan (d: 0) bir anlatımda kadın sesin kaydına dönülür. */
const VOICE_KEY='apps:ses';   // Ezberler ile ortak; önceki sürüm namaz:ses anahtarını kullanıyordu
let plVoice=(()=>{try{return (localStorage.getItem(VOICE_KEY)||localStorage.getItem('namaz:ses'))==='kadin'?'kadin':'erkek'}catch(e){return 'erkek'}})();
const tracksOf=key=>{
  const base=key==='adim'?(kid()?NARR.adim.cocuk:NARR.adim.kadin):NARR.nafile.kadin;
  if(kid()||plVoice!=='erkek') return base;
  const male=NARR[key].erkek; return base.map((t,i)=>male[i]&&male[i].d?male[i]:t);
};

/* =========================================================
   KOLEKSİYONLAR: Adımlar ve Nafile aynı düzeni paylaşır
   (durak seçici + dinleme alanı + bölüm şeridi + kartlar)
   ========================================================= */
const COL={
 adim:{items:STEPS,slides:stepSlides,cur:0,seen:new Set([0]),name:k=>STEPS[k].tt||STEPS[k].t,chip:k=>STEPS[k].t,
       title:k=>`${k+1}. durak · ${STEPS[k].tt||STEPS[k].t}`,guide:'Namazın durakları',endLabel:'Secde bölümü',end:'secde'},
 nafile:{items:NAFILE,slides:nafileSlides,cur:0,seen:new Set([0]),name:k=>NAFILE[k].tt,chip:k=>NAFILE[k].t,
       title:k=>`Nafile · ${NAFILE[k].tt}`,guide:'Nafile namazlar',endLabel:'Başa dön',end:'giris'}
};
let curView='giris', started=false;
function renderStepper(key){
  const c=COL[key], el=$('stepper-'+key);
  el.innerHTML=c.items.map((s,i)=>`<button class="${i===c.cur?'on':''} ${c.seen.has(i)?'done':''}" data-s="${i}" ${i===c.cur?'aria-current="true"':''}><small>${i+1}</small>${emo(s.e)}${c.chip(i)}</button>`).join('');
  const on=el.querySelector('.on'); on&&el.offsetParent&&on.scrollIntoView({inline:'center',block:'nearest',behavior:started&&!reduceMotion.matches?'smooth':'auto'});
}
function renderItem(key,k){
  const c=COL[key], groups=GROUPS[key], seg=$('seg-'+key);
  c.cur=k; c.seen.add(k); renderStepper(key);
  const slides=c.slides(k);
  seg.style.setProperty('--n',groups.length);
  seg.innerHTML=groups.map(([g,l])=>`<button data-g="${g}">${l}</button>`).join('');
  const d=createDeck('d-'+key,slides,{
    onChange:(i,sl)=>{seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.g===sl.g));seg.style.setProperty('--i',groups.findIndex(x=>x[0]===sl.g))},
    endLabel:k<c.items.length-1?`Sıradaki: ${c.chip(k+1)}`:c.endLabel,
    onEnd:()=>{ k<c.items.length-1?renderItem(key,k+1):show(c.end) }
  });
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=slides.findIndex(s=>s.g===b.dataset.g); if(i>-1)d.go(i)});
  if(curView===key) plSync();
  if(started){const dk=document.querySelector(`#d-${key} .deck`);dk.classList.add('swap');dk.addEventListener('animationend',e=>{if(e.target===dk)dk.classList.remove('swap')})}
  setHeader();
}
['adim','nafile'].forEach(key=>{$('stepper-'+key).onclick=e=>{const b=e.target.closest('button');if(b)renderItem(key,+b.dataset.s)}});

/* =========================================================
   DİNLEME ALANI
   ========================================================= */
const player=$('player'), plBtn=$('plBtn'), plTitle=$('plTitle'), plWave=$('plWave'), plCur=$('plCur'), plTot=$('plTot'), plSpeed=$('plSpeed'), plList=$('plList');
const AUDIO_DIR='namaz-audio/', SPEEDS=[[1,'1×','normal'],[1.25,'1.25×','hızlı'],[.8,'0.8×','yavaş']];
const au=new Audio(); au.preload='none';
// Sırayla dinle: bütün uygulamalarla ortak ayar (apps:anlatim-sirali, varsayılan açık)
const SIRA_KEY='apps:anlatim-sirali';
let plKey='adim', plLoaded=null, plSpeedI=0, plAuto=(()=>{try{return localStorage.getItem(SIRA_KEY)!=='0'}catch(e){return true}})(), plSeek=null, plBars=[];
const fmt=x=>{x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
const plIdx=()=>COL[plKey].cur;
const plTrack=(k=plIdx())=>tracksOf(plKey)[k];
const plId=()=>plKey+':'+plIdx()+':'+root.dataset.theme+':'+plVoice;
const plDur=()=>(plLoaded===plId()&&isFinite(au.duration)&&au.duration>0)?au.duration:plTrack().d;
function plPeaks(n){
  const w=plTrack().w, src=w?[...w].map(c=>parseInt(c,36)/35):null, out=[];
  for(let i=0;i<n;i++){
    let v;
    if(src){const a=Math.floor(i/n*src.length), b=Math.max(a+1,Math.floor((i+1)/n*src.length)); v=Math.max(...src.slice(a,b))}
    else v=.3+.5*Math.abs(Math.sin(i*1.7)*Math.cos(i*.37));
    out.push(Math.max(.14,Math.min(1,v)));
  }
  return out;
}
function plDraw(){
  const n=Math.max(10,Math.floor(plWave.clientWidth/4));
  if(n!==plBars.length||plWave.dataset.k!==plId()){
    plWave.dataset.k=plId();
    plWave.innerHTML=plPeaks(n).map(v=>`<i style="--h:${Math.round(v*100)}%"></i>`).join('');
    plBars=[...plWave.children];
  }
  plTick();
}
function plTick(){
  const d=plDur(), t=plLoaded===plId()?au.currentTime:0, r=d?Math.min(1,t/d):0, cut=Math.round(r*plBars.length);
  plBars.forEach((b,i)=>{b.classList.toggle('p',i<cut);b.classList.toggle('h',i===cut-1)});
  plCur.textContent=fmt(t); plTot.textContent=fmt(d);
  plWave.setAttribute('aria-valuenow',Math.round(r*100)); plWave.setAttribute('aria-valuetext',`${fmt(t)} / ${fmt(d)}`);
}
function plState(st){
  player.dataset.state=st;
  plBtn.setAttribute('aria-label',st==='playing'||st==='loading'?'Anlatımı duraklat':'Sesli anlatımı oynat');
  plTitle.textContent=st==='error'?T('Ses kaydı yüklenemedi, tekrar dene','Ses kaydı yüklenemedi, tekrar deneyin'):COL[plKey].title(plIdx());
  plSheetSync();
}
function plPlay(){
  const id=plId();
  if(plLoaded!==id){au.src=AUDIO_DIR+plTrack().f+'.mp3';plLoaded=id}
  au.playbackRate=SPEEDS[plSpeedI][0];
  plState('loading');
  const p=au.play();
  p&&p.catch(e=>{if(e&&e.name==='AbortError')return; if(id===plId()&&player.dataset.state==='loading'){plLoaded=null;plState('error')}});
  plMedya();
}
/* Kilit ekranı / bildirim paneli oynatıcısı (medya.js): durak durak önceki/sonraki */
function plMedya(){
  if(!window.AppsMedya)return;
  const key=plKey, k=plIdx(), n=COL[key].items.length, tr=tracksOf(key);
  AppsMedya.ayarla('namaz',{
    audio:au, baslik:COL[key].title(k), sanatci:'Namaz Yolculuğu',
    album:`Sesli anlatım · ${k+1} / ${n}`,
    oynat:plPlay, duraklat:plPause, kapat:plPause,
    onceki:k>0&&tr[k-1].d?()=>{if(au.currentTime>3)plSeekTo(0);else plGo(k-1,true)}:null,
    sonraki:k<n-1&&tr[k+1].d?()=>plGo(k+1,true):null,
    git:t=>{if(plLoaded===plId()&&isFinite(au.duration)&&au.duration>0){au.currentTime=t;plTick()}}
  });
}
function plPause(){if(!au.paused)au.pause()}
function plToggle(){player.dataset.state==='playing'||player.dataset.state==='loading'?plPause():plPlay()}
function plSync(){ // görünüm ya da durak değişti: çalanı durdur, alanı yeniden hazırla
  if(COL[curView]) plKey=curView;
  au.pause(); plLoaded=null; plSeek=null;
  const slot=$('slot-'+plKey); if(player.parentElement!==slot) slot.appendChild(player);
  player.hidden=!plTrack().d; plState('idle'); plDraw();
  if(window.AppsMedya&&AppsMedya.sahip()==='namaz'){ if(plTrack().d) plMedya(); else AppsMedya.birak('namaz') }
}
function plGo(k,play){const c=COL[plKey]; if(k<0||k>=c.items.length)return; if(curView!==plKey)show(plKey); renderItem(plKey,k); play&&plPlay()}
function plSeekTo(r){
  r=Math.max(0,Math.min(1,r));
  if(plLoaded===plId()&&isFinite(au.duration)&&au.duration>0){au.currentTime=r*au.duration;plTick()}
  else{plSeek=r;plPlay()}
}
au.addEventListener('loadedmetadata',()=>{if(plSeek!==null){au.currentTime=plSeek*au.duration;plSeek=null}plTick()});
au.addEventListener('playing',()=>plState('playing'));
au.addEventListener('waiting',()=>{if(!au.paused)plState('loading')});
au.addEventListener('pause',()=>{if(!au.ended&&player.dataset.state!=='idle'&&player.dataset.state!=='error')plState('paused')});
au.addEventListener('timeupdate',plTick);
au.addEventListener('error',()=>{if(plLoaded===plId()){plLoaded=null;plState('error')}});
au.addEventListener('ended',()=>{
  const key=plKey, k=plIdx(); au.currentTime=0; plState('idle'); plTick();
  if(plAuto&&k<COL[key].items.length-1&&tracksOf(key)[k+1].d&&curView===key){
    // Ekran kilitliyken/arka plandayken bekletmeden geçilir: iOS gecikmeli play() çağrısını engeller.
    if(document.hidden) plGo(k+1,true);
    else setTimeout(()=>{if(plKey===key&&plIdx()===k&&curView===key)plGo(k+1,true)},700);
  }
});
plBtn.onclick=plToggle;
plSpeed.onclick=()=>{plSpeedI=(plSpeedI+1)%SPEEDS.length;const [v,l,n]=SPEEDS[plSpeedI];au.playbackRate=v;plSpeed.textContent=l;plSpeed.setAttribute('aria-label','Okuma hızı: '+n)};
{ let drag=false; const at=e=>{const b=plWave.getBoundingClientRect();return (e.clientX-b.left)/b.width};
  plWave.addEventListener('pointerdown',e=>{drag=true;plWave.setPointerCapture(e.pointerId);plSeekTo(at(e))});
  plWave.addEventListener('pointermove',e=>{if(drag&&plLoaded===plId()&&isFinite(au.duration))plSeekTo(at(e))});
  const end=()=>{drag=false}; plWave.addEventListener('pointerup',end); plWave.addEventListener('pointercancel',end);
  plWave.addEventListener('keydown',e=>{
    const d=plDur()||1, t=plLoaded===plId()?au.currentTime:0;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();plSeekTo((t+(e.key==='ArrowRight'?5:-5))/d)}
    else if(e.key==='Home'){e.preventDefault();plSeekTo(0)}
    else if(e.key===' '||e.key==='Enter'){e.preventDefault();plToggle()}
  });
}
if('ResizeObserver' in window) new ResizeObserver(()=>{if(plWave.clientWidth)plDraw()}).observe(plWave);

/* Sesli rehber paneli: bulunulan bölümün çalma listesi */
function plSheetHtml(){
  const c=COL[plKey], on=player.dataset.state==='playing'||player.dataset.state==='loading';
  return `<h3>${emo('🎧')}Sesli Rehber</h3><p>${c.guide}: ${T('her başlığın kısa anlatımını dinle. Bir başlığa dokun, anlatım oradan başlasın.','her başlığın kısa anlatımını dinleyin. Bir başlığa dokunun, anlatım oradan başlasın.')}</p>
   ${kid()?'':`<div class="voice" role="group" aria-label="Seslendiren"><span>Seslendiren</span><button data-voice="erkek" aria-pressed="${plVoice==='erkek'}">Erkek ses</button><button data-voice="kadin" aria-pressed="${plVoice==='kadin'}">Kadın ses</button></div>`}
   <label class="sw"><input type="checkbox" id="plAutoT" ${plAuto?'checked':''}><span class="knob"></span><span><b>Sırayla dinle</b><small>Bir anlatım bitince sıradakine geçer</small></span></label>
   <ol class="trks">${c.items.map((x,i)=>`<li><button class="trk ${i===c.cur?'on':''} ${i===c.cur&&on?'playing':''}" data-track="${i}" ${i===c.cur?'aria-current="true"':''} ${tracksOf(plKey)[i].d?'':'disabled'}><span class="n">${i+1}</span><span class="nm">${emo(c.items[i].e)}${c.name(i)}</span><span class="du"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>${tracksOf(plKey)[i].d?fmt(tracksOf(plKey)[i].d):''}</span></button></li>`).join('')}</ol>`;
}
function plSheetSync(){if(sheet.dataset.kind==='pl'&&sheet.classList.contains('on')&&!sheet.classList.contains('out'))sheetBody.innerHTML=plSheetHtml()}
plList.onclick=()=>{openSheet(plSheetHtml());sheet.dataset.kind='pl'};

/* =========================================================
   GEZİNME
   ========================================================= */
const VIEWS=[['giris','home','Giriş','Başlangıç'],['hazirlik','prep','Hazırlık','Şartlar ve farzlar'],['adim','steps','Adımlar','11 durakta namaz'],['secde','sajda','Secde','Neden ve nasıl?'],['vakit','clock','Vakitler','Beş vakit ve rekâtlar'],['nafile','nafile','Nafile','Gönüllü namazlar']];
const tabbar=$('tabbar'), hsub=$('hsub'), sheet=$('sheet'), sheetBody=$('sheetBody');
tabbar.innerHTML=VIEWS.map(([k,i,l,d])=>`<button data-v="${k}">${ic(i)}<span>${l}</span><small>${d}</small></button>`).join('');
tabbar.onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
function setHeader(){
  const v=VIEWS.find(x=>x[0]===curView), c=COL[curView];
  hsub.textContent=c?(curView==='adim'?`${c.cur+1}/${c.items.length} · ${c.name(c.cur)}`:c.name(c.cur)):v[2];
}
function show(v){
  const vi=VIEWS.findIndex(x=>x[0]===v), pi=VIEWS.findIndex(x=>x[0]===curView);
  document.querySelector('main').dataset.dir=vi<pi?'b':'f';
  tabbar.style.setProperty('--tab',vi);
  curView=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  tabbar.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.dataset.v===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  if(COL[v]){renderStepper(v);plSync()} else plPause();
  const d=decks['d-'+v]; requestAnimationFrame(()=>{d&&d.refresh();markMore()});
  setHeader();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){show(g.dataset.go);return}
  if(e.target.closest('[data-info]')) openInfo();
});
document.addEventListener('keydown',e=>{
  if(sheet.classList.contains('on')){if(e.key==='Escape')closeSheet();return}
  const d=decks['d-'+curView]; if(!d)return;
  if(e.key==='ArrowRight'){e.preventDefault();d.go(d.idx+1)} if(e.key==='ArrowLeft'){e.preventDefault();d.go(d.idx-1)}
});
window.addEventListener('resize',()=>{const d=decks['d-'+curView];d&&d.refresh()});

/* Alt panel */
function openSheet(html){clearTimeout(sheet._t);sheet.classList.remove('out');sheet.dataset.kind='';sheetBody.innerHTML=html;sheet.classList.add('on');sheet.firstElementChild.scrollTop=0}
function closeSheet(){if(!sheet.classList.contains('on')||sheet.classList.contains('out'))return;sheet.classList.add('out');sheet._t=setTimeout(()=>sheet.classList.remove('on','out'),220)}
$('sheetX').onclick=closeSheet; sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
sheetBody.addEventListener('click',e=>{
  const v=e.target.closest('[data-voice]');
  if(v){ if(v.dataset.voice!==plVoice){plVoice=v.dataset.voice;try{localStorage.setItem(VOICE_KEY,plVoice)}catch(err){} plSync()} return }
  const b=e.target.closest('[data-track]');if(b){const k=+b.dataset.track;k===plIdx()?plToggle():plGo(k,true)}
});
sheetBody.addEventListener('change',e=>{if(e.target.id==='plAutoT'){plAuto=e.target.checked;try{localStorage.setItem(SIRA_KEY,plAuto?'1':'0')}catch(err){}}});
function openInfo(){openSheet(`<h3>Bu rehber nasıl hazırlandı?</h3><p>Bilgiler Kur'an-ı Kerîm, sahih hadis kitapları (Buhârî, Müslim, Ebû Dâvûd, Tirmizî, İbn Mâce, Muvatta) ve Hanefî fıkıh geleneğine dayanır. Her bilginin türü etiketle belirtilmiştir: <b>Âyet</b> ve <b>Hadis</b> etiketliler doğrudan kaynaklardandır, <b>Âlimlerin açıklaması</b> etiketliler âlimlerin yorum ve tespitleridir. Hadis kaynakları kitap ve bölüm adıyla verilmiştir.</p>
 <h3>Nafile namazlar</h3><p>Nafile namazlar bölümünde deliller yalnızca Kur'an âyetleri ile Buhârî ve Müslim'de yer alan hadislerden seçilmiştir. Rivayeti zayıf ya da tartışmalı olan namazlara yer verilmemiştir. Uygulamaya dair ayrıntılar Hanefî mezhebine göredir ve ayrıca belirtilmiştir.</p>
 <h3>Mezhep farkları</h3><p>Namazın uygulanışında (ellerin bağlanacağı yer, kadın ve erkek arasındaki bazı farklar, sünnet rekâtları gibi) mezhepler arasında küçük farklar vardır. Bu rehber Hanefî mezhebini esas alır. Ayrıntılar için bir hocanıza veya Diyanet İşleri Başkanlığı'nın ilmihal kaynaklarına başvurabilirsiniz.</p>
 <h3>Okunuşlar</h3><p>Türkçe harflerle yazılan okunuşlar yalnızca yardımcıdır; Arapça harfleri tam karşılamaz. Doğru telaffuz için sureleri ve duaları bir hocadan dinleyerek öğrenmek en iyisidir.</p>
 <p class="amin">Allah namazlarımızı kabul etsin.</p>`)}
$('infoBtn').onclick=openInfo;

/* =========================================================
   GÖRÜNÜM: tema (çocuk / yetişkin) ve renk (koyu / açık)
   ========================================================= */
const THEME_KEY='apps:tema', MODE_KEY='theme';
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function paint(){
  const m=document.querySelector('meta[name="theme-color"]');
  m&&m.setAttribute('content',getComputedStyle(document.body).backgroundColor);
}
function withReveal(origin,change){
  if(!origin||!document.startViewTransition||reduceMotion.matches){change();paint();return}
  const b=origin.getBoundingClientRect(), x=b.left+b.width/2, y=b.top+b.height/2, r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  root.classList.add('theme-vt');
  const vt=document.startViewTransition(()=>{change();paint()});
  vt.ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:620,easing:'cubic-bezier(.3,.6,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
  vt.finished.finally(()=>root.classList.remove('theme-vt'));
}
function setMode(m,origin){
  if(m===root.dataset.mode)return;
  save(MODE_KEY,m);
  withReveal(origin,()=>{root.setAttribute('data-mode',m);lookSync()});
}
function setTheme(t,origin){
  if(t===root.dataset.theme)return;
  save(THEME_KEY,t);
  withReveal(origin,()=>{root.setAttribute('data-theme',t);rebuild();lookSync()});
}
function rebuild(){ // tema değişince metinler, simgeler ve anlatım kayıtları yenilenir
  const pos={}; for(const k in decks) pos[k]=decks[k].idx;
  const was=started; started=false;
  buildStatic();
  renderItem('adim',COL.adim.cur); renderItem('nafile',COL.nafile.cur);
  for(const k in decks) decks[k].go(pos[k]||0,true);
  started=was;
  show(curView);
}
function lookHtml(){
  const t=root.dataset.theme, m=root.dataset.mode;
  const opt=(attr,val,on,title,desc,sw)=>`<button class="opt" ${attr}="${val}" aria-pressed="${on}"><span class="sws">${sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span><b>${title}</b><small>${desc}</small></button>`;
  return `<h3>Görünüm</h3><p>Tema, uygulama ana ekranındaki seçimle ve diğer uygulamalarla ortaktır.</p>
   <h3 style="font-size:1.15rem;margin-top:20px">Tema</h3>
   <div class="optrow">${opt('data-set-theme','cocuk',t==='cocuk','Çocuk','Renkli ve sıcak; sade bir dille anlatır.',['#ffb703','#7b61ff','#219ebc'])}${opt('data-set-theme','yetiskin',t==='yetiskin','Yetişkin','Sakin ve ciddi; okumaya odaklanır.',['#1d5a47','#dab56d','#f3ecdf'])}</div>
   <h3 style="font-size:1.15rem;margin-top:20px">Renk</h3>
   <div class="optrow">${opt('data-set-mode','light',m==='light','Açık','Aydınlık ortamlar için.',['#fffdf8','#e9e0cf'])}${opt('data-set-mode','dark',m==='dark','Koyu','Loş ortamlar ve gece için.',['#0c1814','#22213a'])}</div>`;
}
function lookSync(){if(sheet.dataset.kind==='look'&&sheet.classList.contains('on'))sheetBody.innerHTML=lookHtml()}
$('lookBtn').onclick=()=>{openSheet(lookHtml());sheet.dataset.kind='look'};
sheetBody.addEventListener('click',e=>{
  const t=e.target.closest('[data-set-theme]'); if(t){setTheme(t.dataset.setTheme,t);return}
  const m=e.target.closest('[data-set-mode]'); if(m)setMode(m.dataset.setMode,m);
});
// başka bir sekmede (ana ekran ya da öteki uygulama) seçim değişirse buraya da yansısın
window.addEventListener('storage',e=>{
  if(e.key===THEME_KEY&&(e.newValue==='cocuk'||e.newValue==='yetiskin')&&e.newValue!==root.dataset.theme){root.setAttribute('data-theme',e.newValue);rebuild();lookSync();paint()}
  if(e.key===MODE_KEY&&(e.newValue==='dark'||e.newValue==='light')){root.setAttribute('data-mode',e.newValue);lookSync();paint()}
});

/* Başlat */
function buildStatic(){
  createDeck('d-giris',GIRIS());
  createDeck('d-hazirlik',HAZIRLIK());
  createDeck('d-secde',SECDE());
  createDeck('d-vakit',VAKITS());
}
buildStatic();
renderItem('adim',0);
renderItem('nafile',0);
show('giris');
started=true;
paint();
</script>
<script src="pwa.js" defer></script>
